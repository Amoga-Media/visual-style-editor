<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Social Media Co-Pilot — Dark Edition</title>
<meta name="description" content="Social media AI that edits, creates, and manages all in one place. 10x growth, automated.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  /* ---------------------------------------------------------
     Tokens - Dark Mode Theme
  --------------------------------------------------------- */
  :root{
    --bg: #09090b; /* Deep zinc */
    --ink: #fafafa;
    --accent: #3b82f6; /* Vibrant Blue */
    --accent-dark: #2563eb;
    --muted: #a1a1aa;
    --muted-2: #71717a;
    --card: rgba(24, 24, 27, 0.65); /* Dark Glass */
    --card-border: rgba(255, 255, 255, 0.08);
    --line: rgba(255, 255, 255, 0.1);

    --shadow-sm: 0 8px 20px rgba(0, 0, 0, 0.3);
    --shadow-md: 0 20px 40px rgba(0, 0, 0, 0.4);
    --shadow-accent: 0 14px 28px rgba(59, 130, 246, 0.35);

    --r-sm: 10px;
    --r-md: 16px;
    --r-lg: 24px;

    --dot: rgba(255, 255, 255, 0.07);
    --ray: rgba(255, 255, 255, 0.04);

    --floater-scale: 1;
  }

  *, *::before, *::after{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--bg);
    /* Deep midnight to subtle violet gradient */
    background: radial-gradient(circle at 50% -20%, #1e1b4b, var(--bg) 60%);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  img, svg{ display:block; max-width:100%; }
  button{ font: inherit; }

  .sr-only{
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  a, button{
    -webkit-tap-highlight-color: transparent;
  }
  a:focus-visible, button:focus-visible{
    outline: 2px solid var(--accent-dark);
    outline-offset: 3px;
    border-radius: 8px;
  }

  /* ---------------------------------------------------------
     Hero shell
  --------------------------------------------------------- */
  .hero{
    position: relative;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: clamp(96px, 14vw, 150px) clamp(20px, 6vw, 72px) clamp(48px, 8vw, 96px);
    isolation: isolate;
  }

  .bg-layer{ position: absolute; inset: 0; z-index: 0; pointer-events: none; }

  .bg-dots{
    position: absolute; inset: 0;
    background-image: radial-gradient(var(--dot) 1.5px, transparent 1.5px);
    background-size: 32px 32px;
  }

  .bg-rays{
    position: absolute;
    top: 0; left: 50%;
    width: min(1200px, 160vw);
    height: 70%;
    transform: translateX(-50%);
  }
  .bg-rays line{
    stroke: var(--ray);
    stroke-width: 1.5;
    stroke-dasharray: 4 8;
    stroke-linecap: round;
  }

  /* ---------------------------------------------------------
     Glassmorphism Utility
  --------------------------------------------------------- */
  .glass {
    background: var(--card);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--card-border);
  }

  /* ---------------------------------------------------------
     Floating Images (Left & Right)
  --------------------------------------------------------- */
  .floaters{
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    transform: scale(var(--floater-scale));
    transform-origin: center;
  }

  .floater{ position: absolute; }
  
  /* Adjusted positioning for actual images */
  .floater--top-left{ top: 8%; left: 3%; width: 220px; transform: rotate(-5deg); }
  .floater--top-right{ top: 12%; right: 4%; width: 200px; transform: rotate(4deg); }
  .floater--mid-left{ top: 40%; left: 4%; width: 180px; transform: rotate(3deg); }
  .floater--mid-right{ top: 42%; right: 3%; width: 240px; transform: rotate(-6deg); }
  .floater--bottom-left{ bottom: 6%; left: 6%; width: 260px; transform: rotate(-2deg); }
  .floater--bottom-right{ bottom: 8%; right: 5%; width: 220px; transform: rotate(5deg); }

  .floating-img {
    width: 100%;
    height: auto;
    border-radius: var(--r-md);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-md);
    background: var(--card);
    backdrop-filter: blur(8px);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  /* ---------------------------------------------------------
     Main content column
  --------------------------------------------------------- */
  .content{
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 680px;
    margin: 0 auto;
  }

  .logo-badge{
    width: 72px; height: 72px;
    border-radius: 22px;
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: clamp(24px, 4vw, 36px);
  }

  .headline{
    margin: 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: clamp(2.4rem, 1.5rem + 4.8vw, 4.2rem);
    line-height: 1.05;
    letter-spacing: -0.03em;
  }
  .headline .line{ display: block; }
  .headline .line-2{ 
    background: linear-gradient(90deg, #3b82f6 0%, #8b5cf6 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subhead{
    margin: clamp(18px, 3vw, 24px) 0 0;
    color: var(--muted);
    font-size: clamp(1rem, .9rem + .5vw, 1.15rem);
    line-height: 1.7;
    max-width: 36em;
  }

  .trust-row{
    margin-top: clamp(26px, 4vw, 36px);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .avatars{ display: flex; }
  .avatar{
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 3px solid var(--bg);
    margin-left: -12px;
    flex: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  }
  .avatar:first-child{ margin-left: 0; }
  /* Placeholder gradients for users */
  .avatar:nth-child(1){ background: linear-gradient(135deg,#FDA4AF,#F43F5E); }
  .avatar:nth-child(2){ background: linear-gradient(135deg,#FDE68A,#F59E0B); }
  .avatar:nth-child(3){ background: linear-gradient(135deg,#93C5FD,#3B82F6); }
  .avatar:nth-child(4){ background: linear-gradient(135deg,#6EE7B7,#10B981); }
  .avatar:nth-child(5){ background: linear-gradient(135deg,#C4B5FD,#8B5CF6); }
  
  .trust-text{ font-size: .9rem; color: var(--muted); }
  .trust-text strong{ color: var(--ink); font-weight: 700; }

  /* Animated CTA */
  .cta{
    position: relative;
    overflow: hidden;
    margin-top: clamp(26px, 4vw, 36px);
    border: none;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    padding: 18px 40px;
    border-radius: 999px;
    box-shadow: var(--shadow-accent);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .cta::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transform: skewX(-20deg);
    animation: shine 3.5s infinite ease-in-out;
  }
  @keyframes shine {
    0% { left: -100%; }
    20% { left: 200%; }
    100% { left: 200%; }
  }
  .cta:hover{
    transform: translateY(-4px);
    box-shadow: 0 24px 40px rgba(59, 130, 246, 0.45);
    background: var(--accent-dark);
  }
  .cta:active{ transform: translateY(-1px); }

  .cta-note{
    margin: 16px 0 0;
    font-size: .85rem;
    color: var(--muted-2);
    font-weight: 500;
  }

  .platform-row{
    margin-top: clamp(36px, 5vw, 54px);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: clamp(14px, 2vw, 20px);
    flex-wrap: wrap;
  }
  .platform-icon{
    width: 52px; height: 52px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow .3s ease;
  }
  .platform-icon:hover{ transform: translateY(-6px) scale(1.05); box-shadow: var(--shadow-md); }
  .platform-icon:nth-child(odd){ transform: translateY(10px); }
  .platform-icon:nth-child(odd):hover{ transform: translateY(2px) scale(1.05); }
  .platform-icon:nth-child(even){ transform: translateY(-8px); }
  .platform-icon:nth-child(even):hover{ transform: translateY(-14px) scale(1.05); }

  /* ---------------------------------------------------------
     Responsive
  --------------------------------------------------------- */
  @media (max-width: 1279px) and (min-width: 1024px){
    :root{ --floater-scale: 0.85; }
  }

  @media (max-width: 1023px){
    .floaters{ display: none; }
    .hero{ padding-top: clamp(72px, 12vw, 110px); }
  }

  @media (max-width: 520px){
    .avatar{ width: 32px; height: 32px; }
    .platform-icon{ width: 48px; height: 48px; border-radius: 14px; }
    .platform-icon:nth-child(odd),
    .platform-icon:nth-child(even){ transform: translateY(0); }
    .platform-icon:hover{ transform: translateY(-4px) scale(1.02); }
    .trust-row{ flex-direction: column; gap: 10px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
  <style id="vse-responsive-styles">
/* Visual Style Editor Responsive Cascades */
/* Tablet Viewport Rules */
html[data-vse-viewport="tablet"] [data-vse-path="html>body:nth-of-type(1)>main:nth-of-type(1)>section:nth-of-type(1)>h1:nth-of-type(1)>span:nth-of-type(1)"],
html[data-vse-viewport="mobile"] [data-vse-path="html>body:nth-of-type(1)>main:nth-of-type(1)>section:nth-of-type(1)>h1:nth-of-type(1)>span:nth-of-type(1)"] {
  font-size: 52px !important;
}

/* Mobile Viewport Rules */
html[data-vse-viewport="mobile"] [data-vse-path="html>body:nth-of-type(1)>main:nth-of-type(1)>section:nth-of-type(1)>h1:nth-of-type(1)>span:nth-of-type(1)"] {
  font-size: 23px !important;
}

@media (max-width: 1024px) {
  html:not([data-vse-viewport]) [data-vse-path="html>body:nth-of-type(1)>main:nth-of-type(1)>section:nth-of-type(1)>h1:nth-of-type(1)>span:nth-of-type(1)"] {
    font-size: 52px !important;
  }
}

@media (max-width: 640px) {
  html:not([data-vse-viewport]) [data-vse-path="html>body:nth-of-type(1)>main:nth-of-type(1)>section:nth-of-type(1)>h1:nth-of-type(1)>span:nth-of-type(1)"] {
    font-size: 23px !important;
  }
}
  </style>
</head>
<body>

<main class="hero">

  <div class="bg-layer" aria-hidden="true">
    <div class="bg-dots"></div>
    <svg class="bg-rays" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMin meet">
      <g>
        <line x1="500" y1="0" x2="80"  y2="600"/>

  <div class="floaters" aria-hidden="true">

      </div>

      <!-- Mid Left Image -->
      <div class="floater floater--mid-left" data-speed="0.04">

      </div>

      <!-- Mid Right Image -->
      <div class="floater floater--mid-right" data-speed="0.03">
        <img class="floating-img" src="https://images.unsplash.com/photo-1551288049-bebda4e38f71?q=80&w=400&auto=format&fit=crop" alt="Data Metrics">
      </div>

      <!-- Bottom Left Image -->
      <div class="floater floater--bottom-left" data-speed="0.015">

      </div>

      <!-- Bottom Right Image -->
      <div class="floater floater--bottom-right" data-speed="0.02">
        <img style="height: 393px; width: 981px; padding: 34px; margin: 0px; position: fixed; display: inline-block; border-radius: 56px; border-width: 14px; opacity: 0.8; rotate: 83deg; scale: 1.6; cursor: default;" class="floating-img" src="https://images.unsplash.com/photo-1555421689-491a97ff2040?q=80&w=400&auto=format&fit=crop" alt="Code and AI">
      </div>
      
    </div>
  </div>

  <section class="content">
    <div class="logo-badge glass">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <path d="M21 6a13 13 0 1 0 8.6 22.9c1.3 1.2 2.6 2.2 4 3" stroke="#fafafa" stroke-width="4.5" fill="none" stroke-linecap="round"/>
        <circle cx="31" cy="30.5" r="3" fill="#fafafa"/>
      </svg>
    </div>

    <h1 class="headline">
      <span style="width: 933px; font-size: 23px;" class="line line-1">World's First AI-Powered</span>
      <span style="font-size: 72px;" class="line line-2">Social Media Co-Pilot</span>
    </h1>

    <p class="subhead">
      Social media AI that edits, creates, and manages all in one place.<br>
      <strong>10x growth. Automated.</strong>
    </p>

    <div class="trust-row">
      <div class="avatars" aria-hidden="true">
        <span class="avatar"></span>
        <span class="avatar"></span>
        <span class="avatar"></span>
        <span class="avatar"></span>
        <span class="avatar"></span>
      </div>
      <p class="trust-text"><strong>4M+</strong> trusted users</p>
    </div>

    <button style="width: 477px;" type="button" class="cta" aria-label="Get Started for Free">Get Started for Free</button>
    <p class="cta-note">No credit card required.</p>

    <footer class="platform-row" aria-label="Supported Platforms">
      <span class="sr-only">Works with YouTube, TikTok, Instagram, LinkedIn, and X</span>

      <span class="platform-icon glass" aria-hidden="true">

          <rect x="1" y="4" width="22" height="16" rx="6" fill="#FF0000"/>

        <svg viewBox="0 0 24 24" width="22" height="22">
          <path d="M13.4 3h2.7c.2 1.7 1.5 3.1 3.2 3.4v2.7c-1.5 0-2.9-.5-4-1.3v6.3a5.1 5.1 0 1 1-4.4-5v2.8a2.3 2.3 0 1 0 2 2.3V3z" fill="#fafafa"/>
        </svg>
      </span>

      <span class="platform-icon glass" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="24" height="24">

            <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#FED576"/>

        </svg>
      </span>

      <span class="platform-icon glass" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22">
          <rect width="24" height="24" rx="6" fill="#111"/>
          <path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

      </span>
    </footer>

  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (typeof gsap === 'undefined') return;

  if (!reduceMotion){
    // Staggered Entrance Animation
    var tl = gsap.timeline({ defaults: { ease: 'power4.out' } });
    tl.from('.logo-badge', { y: -20, autoAlpha: 0, duration: 0.8 })
      .from('.headline .line', { y: 30, autoAlpha: 0, duration: 0.9, stagger: 0.15 }, '-=0.5')
      .from('.subhead', { y: 20, autoAlpha: 0, duration: 0.8 }, '-=0.6')
      .from('.trust-row', { y: 15, autoAlpha: 0, duration: 0.7 }, '-=0.5')
      .from('.cta', { y: 15, autoAlpha: 0, scale: 0.9, duration: 0.7 }, '-=0.5')
      .from('.cta-note', { autoAlpha: 0, duration: 0.5 }, '-=0.4')
      .from('.platform-icon', { y: 25, autoAlpha: 0, duration: 0.6, stagger: 0.08, ease: "back.out(1.7)" }, '-=0.4');

    var mm = gsap.matchMedia();
    mm.add('(min-width: 1024px)', function(){
      // Floating Entrance
      gsap.from('.floater', {
        autoAlpha: 0,
        scale: 0.85,
        y: 40,
        duration: 1.2,
        ease: 'power3.out',
        stagger: 0.15,
        delay: 0.2
      });

      // Hover/Float Yoyo Effect
      var floaters = gsap.utils.toArray('.floater');
      floaters.forEach(function(el, i){
        gsap.to(el, {
          y: '+=15',
          duration: 3 + (i % 3) * 0.5,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1,
          delay: i * 0.2
        });
      });
      
      // Dynamic Parallax on Mouse Move
      document.addEventListener("mousemove", (e) => {
        const x = (window.innerWidth / 2 - e.pageX);
        const y = (window.innerHeight / 2 - e.pageY);
        
        floaters.forEach((floater) => {
          const speed = floater.getAttribute('data-speed');
          gsap.to(floater, {
            x: x * speed,
            y: y * speed,
            duration: 1,
            ease: 'power1.out'
          });
        });
      });
    });
  }
})();
</script>
