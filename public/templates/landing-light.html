<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Light Landing</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex items-center justify-center p-6">
  <div class="max-w-3xl mx-auto text-center space-y-6 py-12">
    <span class="inline-block px-3 py-1 rounded-full bg-blue-100 text-blue-700 text-xs font-semibold">Minimal & Accessible</span>
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-slate-900">Modern software for thoughtful teams</h1>
    <p class="text-slate-600 text-base max-w-lg mx-auto">Collaborate in real time with high fidelity canvas components and frictionless review loops.</p>
    <div class="flex justify-center gap-3 pt-2">
      <button class="px-5 py-2.5 rounded-lg bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm shadow-md cursor-pointer">Start Free Trial</button>
      <button class="px-5 py-2.5 rounded-lg bg-white border border-slate-200 text-slate-700 font-medium text-sm hover:bg-slate-100 cursor-pointer">Learn More</button>
    </div>
  </div>

</html>
