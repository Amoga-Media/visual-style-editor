<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Hero Section</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#09090b] text-white min-h-screen flex items-center justify-center p-6 selection:bg-[#0084FF] selection:text-white">
  <section class="max-w-4xl mx-auto text-center space-y-6 py-16">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/[0.05] border border-white/[0.1] text-xs font-medium text-sky-400">
      <span class="w-1.5 h-1.5 rounded-full bg-sky-400 animate-pulse"></span>
      <span>Next Generation Web Apps</span>
    </div>
    
    <h1 class="text-4xl sm:text-6xl font-extrabold tracking-tight text-white leading-tight">
      Build and launch products with <br>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-[#0084FF] to-indigo-400">
        effortless precision.
      </span>
    </h1>
    
    <p class="text-zinc-400 text-base sm:text-lg max-w-xl mx-auto leading-relaxed">
      A powerful design foundation designed for speed, flexibility, and stunning visual aesthetics right out of the box.
    </p>
    
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-4">
      <button class="px-6 py-3 rounded-xl bg-[#0084FF] hover:bg-[#0074E0] text-white font-semibold text-sm shadow-lg shadow-[#0084FF]/25 cursor-pointer">
        Get Started Free
      </button>
      <button class="px-6 py-3 rounded-xl bg-white/[0.06] hover:bg-white/[0.1] border border-white/[0.1] text-zinc-300 font-semibold text-sm cursor-pointer">
        Live Demonstration
      </button>
    </div>
  </section>
</body>
</html>
